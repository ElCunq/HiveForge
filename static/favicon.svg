<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyberEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#090a0d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Hexagon Base -->
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" 
           fill="#0d0e12" stroke="#26272e" stroke-width="2.5" />

  <!-- Inner Ambient Glow -->
  <polygon points="32,6 55,19 55,45 32,58 9,45 9,19" 
           fill="url(#coreGlow)" />

  <!-- Outer Neural Circuit Hexagon -->
  <polygon points="32,9 52,20.5 52,43.5 32,55 12,43.5 12,20.5" 
           fill="none" stroke="url(#cyberEmerald)" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.85" />

  <!-- 6 Peripheral Agent Synapse Nodes -->
  <circle cx="32" cy="9" r="2.5" fill="#34d399" />
  <circle cx="52" cy="20.5" r="2.5" fill="#34d399" />
  <circle cx="52" cy="43.5" r="2.5" fill="#34d399" />
  <circle cx="32" cy="55" r="2.5" fill="#34d399" />
  <circle cx="12" cy="43.5" r="2.5" fill="#34d399" />
  <circle cx="12" cy="20.5" r="2.5" fill="#34d399" />

  <!-- Inner Honeycomb Anvil Core (The Forge) -->
  <polygon points="32,18 44,25 44,39 32,46 20,39 20,25" 
           fill="#16171d" stroke="url(#amberGold)" stroke-width="2.2" filter="url(#glow)" />

  <!-- The Forge Core Spark / Geometric Nexus -->
  <path d="M32 24 L35.5 30 L41 32 L35.5 34 L32 40 L28.5 34 L23 32 L28.5 30 Z" 
        fill="url(#amberGold)" />
  <circle cx="32" cy="32" r="2" fill="#fff" />
</svg>
