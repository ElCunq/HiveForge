<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100">
  <defs>
    <linearGradient id="amberGoldLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyberEmeraldLogo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <radialGradient id="logoBgGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d0e12" stop-opacity="0"/>
    </radialGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="50" cy="50" r="45" fill="url(#logoBgGlow)" />

  <!-- === ICON GROUP (Scale 1.2x at cx=50, cy=50) === -->
  <g transform="translate(10, 10)">
    <!-- Dark Hexagon Base -->
    <polygon points="40,3 72,21.5 72,58.5 40,77 8,58.5 8,21.5" 
             fill="#0d0e12" stroke="#23242c" stroke-width="2.5" />

    <!-- Outer Neural Circuit Hexagon -->
    <polygon points="40,11 65,25.5 65,54.5 40,69 15,54.5 15,25.5" 
             fill="none" stroke="url(#cyberEmeraldLogo)" stroke-width="2" stroke-dasharray="4,2.5" opacity="0.9" />

    <!-- 6 Peripheral Agent Synapse Nodes -->
    <circle cx="40" cy="11" r="3" fill="#34d399" />
    <circle cx="65" cy="25.5" r="3" fill="#34d399" />
    <circle cx="65" cy="54.5" r="3" fill="#34d399" />
    <circle cx="40" cy="69" r="3" fill="#34d399" />
    <circle cx="15" cy="54.5" r="3" fill="#34d399" />
    <circle cx="15" cy="25.5" r="3" fill="#34d399" />

    <!-- Inner Honeycomb Anvil Core (The Forge) -->
    <polygon points="40,22 55,31 55,49 40,58 25,49 25,31" 
             fill="#14151b" stroke="url(#amberGoldLogo)" stroke-width="2.5" filter="url(#logoGlow)" />

    <!-- The Forge Core Spark / Geometric Nexus -->
    <path d="M40 29 L44.5 37 L51 40 L44.5 43 L40 51 L35.5 43 L29 40 L35.5 37 Z" 
          fill="url(#amberGoldLogo)" />
    <circle cx="40" cy="40" r="2.5" fill="#ffffff" />
  </g>

  <!-- === TYPOGRAPHY GROUP === -->
  <g transform="translate(105, 20)">
    <!-- Brand Title: HIVEFORGE -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-weight="900" font-size="36" letter-spacing="0.05em">
      <tspan fill="url(#amberGoldLogo)">HIVE</tspan><tspan fill="#ffffff">FORGE</tspan>
    </text>

    <!-- Version Badge Tag -->
    <rect x="235" y="18" width="46" height="20" rx="4" fill="rgba(16, 185, 129, 0.14)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="258" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">v3.5</text>

    <!-- Subtitle: Autonomous Multi-Agent Orchestrator -->
    <text x="1" y="62" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#9ca3af" letter-spacing="0.14em">
      AUTONOMOUS MULTI-AGENT MISSION CONTROL
    </text>
  </g>
</svg>
